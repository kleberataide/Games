<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verb + Back Game</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#87CEEB, #e0f7ff);
    overflow: hidden;
}

#game {
    width: 100%;
    height: 100vh;
    position: relative;
}

.path {
    position: absolute;
    bottom: 20%;
    width: 100%;
    height: 120px;
    background: #444;
    z-index: 1;
}

.exit {
    position: absolute;
    right: 20px;
    bottom: 25%;
    background: green;
    color: white;
    padding: 10px;
    border-radius: 10px;
    z-index: 2;
}

.player {
    position: absolute;
    bottom: 25%;
    left: 10%;
    width: 60px;
    height: 60px;
    background: red;
    border-radius: 50%;
    transition: left 0.4s ease;
    z-index: 3;
}

.player::after {
    content: "💣";
    position: absolute;
    top: -20px;
    left: 10px;
}

.quiz {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    background: #2196F3;
    color: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    z-index: 4;
}

.feedback {
    position: absolute;
    top: 5%;
    width: 100%;
    text-align: center;
    font-weight: bold;
}

.lives {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 24px;
}

.progress-container {
    position: absolute;
    top: 0;
    width: 100%;
    height: 10px;
    background: #ccc;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: green;
}

.explode {
    animation: explode 0.5s forwards;
}

@keyframes explode {
    0% { transform: scale(1); }
    50% { transform: scale(2); background: orange; }
    100% { transform: scale(0); opacity: 0; }
}

.shake {
    animation: shake 0.3s;
}

@keyframes shake {
    25% { transform: translate(5px); }
    50% { transform: translate(-5px); }
}
button {
    margin: 8px;
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="game">
    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="lives" id="lives"></div>
    <div class="feedback" id="feedback"></div>

    <div class="quiz" id="quiz"></div>

    <div class="player" id="player"></div>
    <div class="path"></div>
    <div class="exit">SAÍDA</div>
</div>

<script>
const questions = [
{
q: "You left your phone at home. Now you return to get it. You ____ home.",
a: ["go back", "come back", "call back"],
correct: 0,
explain: "Usamos 'go back' quando voltamos para um lugar."
},
{
q: "You were here yesterday and now you return. You ____.",
a: ["come", "come back", "go back"],
correct: 1,
explain: "'Come back' = retornar ao lugar onde você está agora."
},
{
q: "You bought shoes in a physical store and want to return them. You ____ them.",
a: ["send back", "take back", "give back"],
correct: 1,
explain: "'Take back' = devolver na loja física."
},
{
q: "You bought a product online and need to return it by mail. You ____ it.",
a: ["take back", "send back", "call back"],
correct: 1,
explain: "'Send back' = devolver online."
},
{
q: "You borrowed money from a friend. You must ____ it.",
a: ["give back", "pay back", "send back"],
correct: 1,
explain: "'Pay back' é usado para dinheiro."
},
{
q: "You borrowed a book. You must ____ it.",
a: ["pay back", "give back", "take back"],
correct: 1,
explain: "'Give back' = devolver objeto."
},
{
q: "Your boss called you but you missed it. You need to ____ him.",
a: ["go back", "call back", "come back"],
correct: 1,
explain: "'Call back' = retornar ligação."
},
{
q: "Choose the correct sentence:",
a: ["Call back me later", "Call me back later", "Back call me later"],
correct: 1,
explain: "Pronome vem no meio: 'Call me back'."
},
{
q: "After traveling, you return to your city. You ____ home.",
a: ["come back", "go back", "send back"],
correct: 0,
explain: "'Come back' usado quando o ponto de referência é aqui."
},
{
q: "The company asked me to ____ the defective product.",
a: ["send back", "call back", "pay back"],
correct: 0,
explain: "Produto com defeito → 'send back'."
},
{
q: "I will ____ your money next week.",
a: ["give back", "pay back", "take back"],
correct: 1,
explain: "Dinheiro → 'pay back'."
},
{
q: "He forgot his bag and had to ____ to the office.",
a: ["go back", "come back", "call back"],
correct: 0,
explain: "Voltar ao local → 'go back'."
},
{
q: "Please ____ my pen tomorrow.",
a: ["give back", "pay back", "send back"],
correct: 0,
explain: "Objeto → 'give back'."
},
{
q: "Customer service will ____ you later.",
a: ["call back", "go back", "take back"],
correct: 0,
explain: "Ligação → 'call back'."
},
{
q: "I need to ____ this package to the seller.",
a: ["take back", "send back", "give back"],
correct: 1,
explain: "Correios → 'send back'."
}
];

let current = 0;
let lives = 3;
let combo = 0;

const startPos = 10;
const endPos = 88;
const totalDistance = endPos - startPos;

/* SOM */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, duration){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    setTimeout(()=>osc.stop(), duration*1000);
}

function updateLives(){
    document.getElementById("lives").innerHTML = "❤️".repeat(lives);
}

function showFeedback(text,color="white"){
    const f = document.getElementById("feedback");
    f.innerText = text;
    f.style.color = color;
    setTimeout(()=>f.innerText="",2000);
}

function loadQuestion(){
    const q = questions[current];
    document.getElementById("quiz").innerHTML =
        `<h3>${q.q}</h3>` +
        q.a.map((opt,i)=>`<button onclick="answer(${i})">${opt}</button>`).join("");
}

function movePlayer(){
    let ratio = current / questions.length;
    let pos = startPos + ratio * totalDistance;
    document.getElementById("player").style.left = pos + "%";
    document.getElementById("progress").style.width = (ratio*100)+"%";
}

function answer(i){
    const q = questions[current];

    if(i===q.correct){
        combo++;
        playSound(600 + combo*50,0.2);

        showFeedback(`✅ ${q.explain} | Combo ${combo}`,"blue");

        current++;
        movePlayer();

        if(current>=questions.length){
            showFeedback("🏆 Você chegou à saída!","yellow");
            setTimeout(()=>location.reload(),2000);
        } else {
            setTimeout(loadQuestion,300);
        }

    } else {
        combo=0;
        lives--;
        updateLives();

        playSound(100,0.5);
        showFeedback("💥 "+q.explain,"orange");

        const player=document.getElementById("player");
        const game=document.getElementById("game");

        player.classList.add("explode");
        game.classList.add("shake");

        setTimeout(()=>{
            player.classList.remove("explode");
            game.classList.remove("shake");

            if(lives<=0){
                showFeedback("💀 Game Over","red");
                setTimeout(()=>location.reload(),1500);
            }
        },600);
    }
}

updateLives();
loadQuestion();
</script>

</body>
</html>
