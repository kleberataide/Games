<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo: Verb + Back</title>
    <style>
        :root {
            --primary-color: #0056b3; /* Azul Profundo */
            --secondary-color: #28a745; /* Verde Sucesso */
            --tertiary-color: #fd7e14; /* Laranja Alerta */
            --wrong-color: #dc3545; /* Vermelho Erro */
            --background-color: #f0f8ff; /* Azul Alice */
            --text-color: #333;
            --white: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #quiz-container {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        /* Progress Bar */
        #progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        #progress-bar {
            height: 10px;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Icon Placeholder */
        #icon-container {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        #question-text {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        #options-container {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e2e6ea;
            border-color: var(--primary-color);
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Feedback Area */
        #feedback-container {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            display: none; /* Hidden by default */
        }

        .feedback-correct {
            border: 2px solid var(--secondary-color);
            background-color: #d4edda;
        }

        .feedback-wrong {
            border: 2px solid var(--wrong-color);
            background-color: #f8d7da;
        }

        #feedback-status {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .explanation {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .example-box {
            background-color: rgba(255,255,255,0.7);
            padding: 0.8rem;
            border-radius: 5px;
            border-left: 4px solid var(--tertiary-color);
        }

        .example-en {
            font-weight: bold;
            color: #444;
        }

        .example-pt {
            color: #666;
            font-style: italic;
        }

        /* Next Button */
        #next-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background-color 0.2s ease;
            display: none; /* Hidden by default */
        }

        #next-btn:hover {
            background-color: #004085;
        }

        /* Final Score Screen */
        #score-screen {
            display: none; /* Hidden by default */
            text-align: center;
        }

        #final-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 1rem 0;
        }

        #restart-btn {
            background-color: var(--tertiary-color);
            color: var(--white);
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.2s ease;
        }

        #restart-btn:hover {
            background-color: #d3610b;
        }

    </style>
</head>
<body>

    <div id="quiz-container">
        <h1>Quiz: Verb + Back</h1>
        
        <div id="game-screen">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div id="icon-container">
                <span id="q-icon">❓</span> 
            </div>

            <p id="question-text">Clique em 'Iniciar Quiz' para começar.</p>

            <div id="options-container">
                </div>

            <div id="feedback-container">
                <span id="feedback-status"></span>
                <p class="explanation" id="feedback-explanation"></p>
                <div class="example-box">
                    <p class="example-en" id="feedback-example-en"></p>
                    <p class="example-pt" id="feedback-example-pt"></p>
                </div>
            </div>

            <button id="next-btn">Próxima Pergunta ➔</button>
        </div>

        <div id="score-screen">
            <h2>Quiz Concluído!</h2>
            <p>Sua pontuação final foi:</p>
            <p id="final-score">0</p>
            <p id="total-questions">De X perguntas.</p>
            <button id="restart-btn">Reiniciar Quiz ↺</button>
        </div>
        
    </div>

    <script>
        // Ícones representativos para os verbos
        const verbIcons = {
            "go": "🏃‍♂️",
            "come": "🔙",
            "give": "🎁",
            "take": "🛍️",
            "call": "📞",
            "pay": "💰",
            "send": "📦"
        };

        const quizData = [
            // Categoria 1: Diferença 'Come' vs 'Come Back' (Seção 4a) - 5 Exercícios
            {
                type: "come",
                question: "Qual frase está correta se Sarah esteve no Brasil, foi embora e agora está no Brasil novamente?",
                options: ["Sarah came to Brazil.", "Sarah came back to Brazil."],
                answer: 1,
                explanation: "'Come back' indica o retorno a um lugar onde você já esteve antes.",
                exampleEn: "Sarah came back to Brazil.",
                examplePt: "Sarah voltou para o Brasil."
            },
            {
                type: "come",
                question: "Seu amigo está visitando os EUA pela primeira vez. Como você diz 'Você veio aos EUA'?",
                options: ["You came back to the USA.", "You came to the USA."],
                answer: 1,
                explanation: "Usamos 'came' (sem 'back') quando é a primeira vez ou uma visita simples, sem a noção de retorno.",
                exampleEn: "You came to the USA.",
                examplePt: "Você veio aos EUA."
            },
            {
                type: "come",
                question: "Qual frase implica que John já morou na Inglaterra antes?",
                options: ["John came to England.", "John came back to England."],
                answer: 1,
                explanation: "'Back' adiciona a informação essencial de que a ação está sendo repetida ou um estado anterior está sendo reestabelecido.",
                exampleEn: "John came back to England.",
                examplePt: "John voltou para a Inglaterra."
            },
            {
                type: "come",
                question: "Uma pessoa diz: 'We came ___ this beach last year, so we are here now for the second time.'",
                options: ["to", "back to"],
                answer: 1,
                explanation: "Como é a segunda vez, a ação é retornar, portanto usamos 'back to'.",
                exampleEn: "We came back to this beach...",
                examplePt: "Nós voltamos para esta praia..."
            },
            {
                type: "come",
                question: "No texto, 'Carmen came to England' significa que ela está na Inglaterra, mas não sabemos se ela já esteve lá antes.",
                options: ["Verdadeiro", "Falso"],
                answer: 0,
                explanation: "Correto. O uso de 'came to' foca apenas na chegada dela, não em um histórico de visitas.",
                exampleEn: "Carmen came to England.",
                examplePt: "Carmen veio para a Inglaterra."
            },

            // Categoria 2: Go Back (Seção 4b e 4d) - 4 Exercícios
            {
                type: "go",
                question: "Complete: 'A: Are you feeling better?' / 'B: Yes, I think I'll ___ to work tomorrow.'",
                options: ["go", "go back"],
                answer: 1,
                explanation: "Usamos 'go back' para retornar a um local regular (como trabalho, escola ou casa).",
                exampleEn: "I'll go back to work tomorrow.",
                examplePt: "Eu voltarei para o trabalho amanhã."
            },
            {
                type: "go",
                question: "Você está em um restaurante e percebe que esqueceu a carteira em casa. O que você diz?",
                options: ["I need to go home.", "I need to go back home."],
                answer: 1,
                explanation: "Como você acabou de sair de casa, você precisa retornar para lá.",
                exampleEn: "I need to go back home.",
                examplePt: "Eu preciso voltar para casa."
            },
            {
                type: "go",
                question: "Qual é a tradução mais precisa para 'go back'?",
                options: ["Ir embora.", "Voltar / Retornar."],
                answer: 1,
                explanation: "'Go back' combina 'go' (ir) com 'back' (de volta), resultando em 'voltar'.",
                exampleEn: "We are going back soon.",
                examplePt: "Nós estamos voltando logo."
            },
            {
                type: "go",
                question: "A pergunta de conversação 4d: 'When you come back after a vacation...' usa 'come back' no mesmo sentido que 'go back' em outra frase?",
                options: ["Sim", "Não"],
                answer: 0,
                explanation: "'Come back' e 'go back' ambos significam 'retornar', a diferença está na perspectiva de quem fala (vir vs. ir).",
                exampleEn: "When you come back...",
                examplePt: "Quando você volta..."
            },

            // Categoria 3: Take Back (Seção 4b e 4d) - 5 Exercícios
            {
                type: "take",
                question: "Complete: 'A: The shirt you bought me is too small.' / 'B: I'll ___ to the store and exchange it.'",
                options: ["take it", "take it back"],
                answer: 1,
                explanation: "'Take it back' significa levar um item pessoalmente de volta à loja de onde ele veio.",
                exampleEn: "I'll take it back to the store.",
                examplePt: "Vou levá-lo de volta à loja."
            },
            {
                type: "take",
                question: "Você comprou um liquidificador, mas ele não funciona. O que você faz?",
                options: ["You take it back to the shop.", "You send it back to the shop."],
                answer: 0,
                explanation: "Se você vai pessoalmente, usa-se 'take back'. 'Send back' é geralmente por correio.",
                exampleEn: "Take the blender back.",
                examplePt: "Leve o liquidificador de volta."
            },
            {
                type: "take",
                question: "No diálogo da seção 4b, o personagem B diz que vai 'take it back' e troca-lo (exchange it). Para isso, ele precisa do quê?",
                options: ["The change.", "The receipt."],
                answer: 1,
                explanation: "'Receipt' significa recibo/nota fiscal, necessário para a devolução.",
                exampleEn: "I still have the receipt.",
                examplePt: "Eu ainda tenho o recibo."
            },
            {
                type: "take",
                question: "Qual item combina melhor com a ação 'take back' na seção 4d?",
                options: ["Something you buy from a store.", "Something you buy online."],
                answer: 0,
                explanation: "Como visto no item 6 da seção 4d, 'take back' é usado tipicamente para lojas físicas.",
                exampleEn: "Take something back to a store.",
                examplePt: "Levar algo de volta a uma loja."
            },
            {
                type: "take",
                question: "Qual das frases a seguir usa o phrasal verb incorretamente?",
                options: ["I'll take the book back to the library.", "I'll pay the shirt back."],
                answer: 1,
                explanation: "'Pay back' é apenas para dinheiro. O correto seria 'take it back' ou 'give it back' para um objeto físico.",
                exampleEn: "I'll take the book back.",
                examplePt: "Vou levar o livro de volta."
            },

            // Categoria 4: Call Back (Seção 4b e 4d) - 4 Exercícios
            {
                type: "call",
                question: "Complete: 'A: Hi, Jack. It's me, Karen.' / 'B: I can't talk now, I'm driving – I'll ___ in 15 minutes.'",
                options: ["call you", "call you back"],
                answer: 1,
                explanation: "'Call back' é o ato de retornar uma ligação telefônica a alguém.",
                exampleEn: "I'll call you back soon.",
                examplePt: "Ligo-te de volta em breve."
            },
            {
                type: "call",
                question: "Você recebe uma mensagem de voz. O que você faz?",
                options: ["You call the message back.", "You call the person back."],
                answer: 1,
                explanation: "Você liga de volta para a pessoa (the person) que deixou a mensagem.",
                exampleEn: "Call me back immediately!",
                examplePt: "Ligue-me de volta imediatamente!"
            },
            {
                type: "call",
                question: "A pergunta 1 da seção 4d: 'When someone leaves you a message...' refere-se a qual verbo?",
                options: ["Send back.", "Call back."],
                answer: 1,
                explanation: "'Leaving a message' (deixar uma mensagem) é um contexto claro para 'call back'.",
                exampleEn: "Call them back immediately.",
                examplePt: "Ligue-lhes de volta imediatamente."
            },
            {
                type: "call",
                question: "Você está no meio de uma conversa importante e a ligação cai. Você diz para a pessoa: 'I will ___ you ___'.",
                options: ["give / back", "call / back"],
                answer: 1,
                explanation: "Este contexto de reconexão telefônica exige 'call back'.",
                exampleEn: "I will call you back.",
                examplePt: "Eu vou te ligar de volta."
            },

            // Categoria 5: Give Back (Seção 4b e 4d) - 5 Exercícios
            {
                type: "give",
                question: "Complete: 'A: That's my pen you're using!' / 'B: It is? Sorry. I'll ___ in a minute.'",
                options: ["give it back", "give back"],
                answer: 0,
                explanation: "Para objetos específicos, devemos usar o pronome (it, them) no meio do phrasal verb: 'give IT back'.",
                exampleEn: "Give it back to me.",
                examplePt: "Devolve-mo."
            },
            {
                type: "give",
                question: "O item 5 da seção 4d pergunta se você lembra de ___ as coisas que pega emprestado.",
                options: ["give back", "pay back"],
                answer: 0,
                explanation: "Usamos 'give back' para objetos genéricos, enquanto 'pay back' é específico para dinheiro.",
                exampleEn: "When you borrow something, give it back.",
                examplePt: "Quando você pega algo emprestado, devolva-o."
            },
            {
                type: "give",
                question: "A frase 'I borrowed a movie from my friend and I need to return it' pode ser reescrita usando:",
                options: ["give it back.", "take it back."],
                answer: 0,
                explanation: "'Give back' é a maneira mais comum de expressar a devolução de algo emprestado.",
                exampleEn: "I need to give it back.",
                examplePt: "Eu preciso devolvê-lo."
            },
            {
                type: "give",
                question: "Diferença sutil: 'Take back' foca na ação de *levar* algo ao local de origem (loja), enquanto 'Give back' foca no ato de *entregar* o objeto de volta ao dono.",
                options: ["Verdadeiro", "Falso"],
                answer: 0,
                explanation: "Correto. 'Take back' geralmente implica uma transação de retorno (loja, biblioteca), enquanto 'Give back' é a devolução simples entre pessoas.",
                exampleEn: "Give me back my money.",
                examplePt: "Me devolva meu dinheiro (entregar de volta)."
            },
            {
                type: "give",
                question: "Qual das opções abaixo NÃO pode ser o objeto na frase 'Give ___ back'?",
                options: ["it", "a store"],
                answer: 1,
                explanation: "'A store' é um local, não um objeto que você pode segurar e devolver. Você 'takes back to' a store.",
                exampleEn: "Give it back.",
                examplePt: "Devolva-o."
            },

            // Categoria 6: Pay Back (Seção 4b e 4d) - 4 Exercícios
            {
                type: "pay",
                question: "Complete: 'A: Can you lend me $20?' / 'B: I'll ___ next week.'",
                options: ["pay it", "pay you back"],
                answer: 1,
                explanation: "'Pay you back' significa devolver dinheiro emprestado à pessoa que o emprestou.",
                exampleEn: "I'll pay you back next week.",
                examplePt: "Eu vou te pagar de volta na semana que vem."
            },
            {
                type: "pay",
                question: "No item 3 da seção 4d, a pergunta é: 'Have you ever lent somebody money and they didn't ___?'",
                options: ["give back.", "pay you back?"],
                answer: 1,
                explanation: "'Pay back' é a expressão mais específica e correta para transações financeiras.",
                exampleEn: "Didn't pay you back?",
                examplePt: "Não te pagaram de volta?"
            },
            {
                type: "pay",
                question: "O que significa 'I lend you money'?",
                options: ["Eu te empresto dinheiro.", "Eu te pago dinheiro."],
                answer: 0,
                explanation: "'To lend' significa emprestar. 'To pay' significa pagar.",
                exampleEn: "I can lend you money.",
                examplePt: "Eu posso te emprestar dinheiro."
            },
            {
                type: "pay",
                question: "Qual das frases é gramaticalmente incorreta para 'pay back'?",
                options: ["Pay back the money.", "Pay back to the bank."],
                answer: 1,
                explanation: "'Pay back' é transitivo e precisa de um objeto direto (money) ou indireto (the person). Não usamos 'to' dessa forma.",
                exampleEn: "Pay back the money.",
                examplePt: "Pague de volta o dinheiro."
            },

            // Categoria 7: Send Back (Seção 4b e 4d) - 3 Exercícios
            {
                type: "send",
                question: "Complete: 'A: Where did you buy those shoes?' / 'B: I got them online, but they're too big. I think I'll ___.'",
                options: ["take them", "send them back"],
                answer: 1,
                explanation: "'Send them back' é o phrasal verb correto para devolver uma compra online, geralmente via correio.",
                exampleEn: "I'll send them back.",
                examplePt: "Vou mandá-los de volta (pelo correio)."
            },
            {
                type: "send",
                question: "No item 2 da seção 4d, pergunta-se se você sempre ___ algo comprado online que não era o que queria.",
                options: ["take back", "send it back"],
                answer: 1,
                explanation: "Compras online (online purchases) estão ligadas diretamente à ação de enviar de volta ('send back').",
                exampleEn: "Do you send it back?",
                examplePt: "Você o envia de volta?"
            },
            {
                type: "send",
                question: "A diferença fundamental entre 'Take Back' e 'Send Back' é que o primeiro é pessoal e o segundo é à distância (correio).",
                options: ["Verdadeiro", "Falso"],
                answer: 0,
                explanation: "Correto. Essa é a distinção contextual que a página 4 do livro estabelece.",
                exampleEn: "Send the item back by mail.",
                examplePt: "Envie o item de volta pelo correio."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const elements = {
            gameScreen: document.getElementById('game-screen'),
            scoreScreen: document.getElementById('score-screen'),
            progressBar: document.getElementById('progress-bar'),
            icon: document.getElementById('q-icon'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            feedbackContainer: document.getElementById('feedback-container'),
            feedbackStatus: document.getElementById('feedback-status'),
            feedbackExplanation: document.getElementById('feedback-explanation'),
            feedbackExampleEn: document.getElementById('feedback-example-en'),
            feedbackExamplePt: document.getElementById('feedback-example-pt'),
            nextBtn: document.getElementById('next-btn'),
            finalScore: document.getElementById('final-score'),
            totalQuestions: document.getElementById('total-questions'),
            restartBtn: document.getElementById('restart-btn')
        };

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            elements.gameScreen.style.display = 'block';
            elements.scoreScreen.style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            // Reset feedback
            elements.feedbackContainer.style.display = 'none';
            elements.nextBtn.style.display = 'none';
            elements.feedbackContainer.className = ''; // Remove existing classes

            // Update Progress Bar
            const progressPercentage = ((currentQuestionIndex + 1) / quizData.length) * 100;
            elements.progressBar.style.width = `${progressPercentage}%`;

            const currentQuestion = quizData[currentQuestionIndex];

            // Update Icon and Question Text
            elements.icon.textContent = verbIcons[currentQuestion.type] || "❓";
            elements.questionText.textContent = currentQuestion.question;

            // Clear previous options
            elements.optionsContainer.innerHTML = '';

            // Generate options as buttons
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('option-btn');
                button.onclick = () => selectOption(index);
                elements.optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex) {
            const currentQuestion = quizData[currentQuestionIndex];
            const isCorrect = (selectedIndex === currentQuestion.answer);

            // Disable all option buttons
            const optionButtons = elements.optionsContainer.querySelectorAll('.option-btn');
            optionButtons.forEach(btn => btn.disabled = true);

            // Style the selected button
            optionButtons[selectedIndex].style.borderColor = isCorrect ? 'var(--secondary-color)' : 'var(--wrong-color)';
            optionButtons[selectedIndex].style.backgroundColor = isCorrect ? '#d4edda' : '#f8d7da';

            // Handle Score and Feedback Appearance
            if (isCorrect) {
                score++;
                elements.feedbackContainer.className = 'feedback-correct';
                elements.feedbackStatus.textContent = '✅ Correto!';
                elements.feedbackStatus.style.color = 'var(--secondary-color)';
            } else {
                elements.feedbackContainer.className = 'feedback-wrong';
                elements.feedbackStatus.textContent = '❌ Incorreto.';
                elements.feedbackStatus.style.color = 'var(--wrong-color)';
            }

            // Fill Feedback Details
            elements.feedbackExplanation.textContent = currentQuestion.explanation;
            elements.feedbackExampleEn.textContent = currentQuestion.exampleEn;
            elements.feedbackExamplePt.textContent = currentQuestion.examplePt;

            // Show Feedback and Next Button
            elements.feedbackContainer.style.display = 'block';
            elements.nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            elements.gameScreen.style.display = 'none';
            elements.scoreScreen.style.display = 'block';
            elements.finalScore.textContent = score;
            elements.totalQuestions.textContent = `De ${quizData.length} perguntas.`;
        }

        // Event Listeners
        elements.nextBtn.onclick = nextQuestion;
        elements.restartBtn.onclick = startQuiz;

        // Initialize quiz automatically (optional, or wait for click)
        startQuiz();

    </script>
</body>
</html>
